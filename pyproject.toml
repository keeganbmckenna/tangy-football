[project]
name = "tangy-football"
version = "1.0.0"
description = "Data scripts and model research behind the Tangy Football fantasy league site"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.3.3",
    "pyarrow>=20.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
# GPU simulators and model research (scripts/backtests/gpu_sim.py and friends)
gpu = ["torch>=2.8"]

[tool.uv]
package = false
